<html>
<head>
    <title>Netflix Sign In</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
             background-color: #444;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
        }

        .login-box {
            width: 350px;
            background-color: rgba(0, 0, 0, 0.80);
            padding: 45px;
            margin: 80px auto;
            border-radius: 8px;
        }

        h1 {
            color: white;
            font-size: 38px;
            margin-bottom: 35px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 18px;
            margin-bottom: 18px;
            box-sizing: border-box;
            border: none;
            border-radius: 5px;
            background-color: #555;
            color: white;
            font-size: 16px;
        }

        input::placeholder {
            color: white;
            font-weight: bold;
        }

        .signin {
            width: 100%;
            padding: 17px;
            background-color: #ff3b30;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .signin:hover {
            background-color: #e50914;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-top: 18px;
            font-size: 14px;
        }

        .options a {
            color: white;
            text-decoration: none;
        }

        .signup {
            color: #ccc;
            margin-top: 40px;
            font-size: 16px;
        }

        .signup b {
            color: white;
        }
    </style>

    <script>
        function validateLogin() {

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

        
            let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

            if (email == "") {
                alert("Please enter your Email.");
                return false;
            }

            if (!emailPattern.test(email)) {
                alert("Please enter a valid Email address.");
                return false;
            }

        
            if (password == "") {
                alert("Please enter your Password.");
                return false;
            }

            if (password.length < 6) {
                alert("Password must contain at least 6 characters.");
                return false;
            }

       
            alert("Sign In Successful!");

            return true;
        }
    </script>
</head>

<body>

    <div class="login-box">

        <h1>Sign In</h1>

        <form onsubmit="return validateLogin()">

            <input type="text"
                   id="email"
                   placeholder="Email or Phone Number">

            <input type="password"
                   id="password"
                   placeholder="Password">

            <button type="submit" class="signin">
                Sign In
            </button>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <div class="signup">
                New to Netflix? <b>Sign Up Now</b>
            </div>

        </form>

    </div>

</body>
</html>
